 <div class="container-fluid py-4">
  <div class="app-header text-center mb-4">
    <h1 class="fw-bold text-primary">AI Text Summarizer</h1>
    <p class="text-muted">Paste your content on the left, get a clean summary on the right.</p>
  </div>

  <div class="row">
    <!-- Left Side: Input -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4 h-100">
        <h4 class="mb-3 text-secondary">Enter Your Text</h4>
        <textarea
          [(ngModel)]="content"
          rows="18"
          placeholder="Paste or type your text here..."
          class="form-control mb-3 input-area"></textarea>

        <!-- <button type="button" (click)="generateSummary()" class="btn btn-primary btn-sm">
          {{ loading ? 'Summarizing...' : 'Summarize' }}
        </button> -->

        <div class="text-center mt-3">
          <button 
            type="button" 
            (click)="generateSummary()" 
            class="btn btn-primary btn-sm summarize-btn">
            {{ loading ? 'Summarizing...' : 'Summarize' }}
          </button>
        </div>


        <p class="mt-3 text-muted small">
          ✨ Tip: Longer text gives better summaries. Try pasting an article or essay.
        </p>
      </div>
    </div>

    <!-- Right Side: Output -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4 h-100 result" *ngIf="summary">
        <h4 class="mb-3 text-secondary">Generated Summary</h4>
        <pre class="summary-box">{{ summary }}</pre>
        <p class="mt-3 text-muted small">
          ✅ Summarized using AI. Copy or refine as needed.
        </p>
      </div>
    </div>
  </div>
</div>

<router-outlet/>
